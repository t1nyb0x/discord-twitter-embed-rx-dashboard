name: CI-dashboard

on:
  pull_request:
    branches: ["main", "develop"]

permissions: {}

jobs:
  setup:
    permissions:
      packages: read
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          registry-url: "https://npm.pkg.github.com"
          scope: "@rx-twitter"

      - name: Cache node_modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      packages: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          registry-url: "https://npm.pkg.github.com"
          scope: "@rx-twitter"

      - name: Restore node_modules cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run OxLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      packages: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          registry-url: "https://npm.pkg.github.com"
          scope: "@rx-twitter"

      - name: Restore node_modules cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests with coverage
        run: npm run test:coverage

  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: test
    permissions:
      packages: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          registry-url: "https://npm.pkg.github.com"
          scope: "@rx-twitter"

      - name: Restore node_modules cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Drizzle migrations
        run: npm run db:generate

      - name: Check for uncommitted migration files
        run: |
          if ! git diff --exit-code -- drizzle/; then
            echo "::error::drizzle/ has uncommitted changes after db:generate."
            echo "Run 'npm run db:generate' locally and commit the result."
            exit 1
          fi

      - name: Build Dashboard
        run: npm run build

      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          echo "Build successful"

  e2e:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: read

    # Dashboard は起動時に initializeApp() が Redis へ再シードするため、
    # 実 Redis がないと起動できない
    services:
      redis:
        image: redis:8.2.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          registry-url: "https://npm.pkg.github.com"
          scope: "@rx-twitter"

      - name: Restore node_modules cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # better-sqlite3 は親ディレクトリを作らないため data/ を先に用意する。
      # テーブルが無いと再シードが落ちて全リクエストが 500 になる。
      - name: Prepare database
        run: |
          mkdir -p data
          npm run db:migrate

      # 型チェック（astro check）は build ジョブで済んでいるので成果物だけ作る
      - name: Build Dashboard
        run: npx astro build

      # 実シークレットは不要。ログイン API は OAuth URL を組み立てるだけで
      # Discord へは到達しないため、ダミー値で 302 の検証まで通る。
      - name: Start Dashboard
        run: nohup node server-start.mjs > dashboard.log 2>&1 &
        env:
          NODE_ENV: production
          HOST: 127.0.0.1
          PORT: 4321
          REDIS_URL: redis://localhost:6379
          SESSION_SECRET: ci-e2e-session-secret-minimum-32-characters
          ENCRYPTION_SALT: ci-e2e-salt-16chars
          DISCORD_OAUTH2_CLIENT_ID: "000000000000000000"
          DISCORD_OAUTH2_CLIENT_SECRET: ci-e2e-dummy-secret
          DISCORD_OAUTH2_REDIRECT_URI: http://localhost:4321/api/auth/discord/callback

      - name: Wait for Dashboard
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:4321/; then
              echo "Dashboard is ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Dashboard did not become ready within 30s"
          cat dashboard.log
          exit 1

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Dump Dashboard log on failure
        if: failure()
        run: cat dashboard.log
